name: Validate cards

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check menstrual-cycle-gauge-card.js
          node --check menstrual-cycle-heatmap-card.js
      - name: Validate HACS metadata
        uses: hacs/action@main
        with:
          category: plugin

